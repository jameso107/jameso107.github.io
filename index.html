  <script>
    // Homepage intro: the page content is real HTML (crawlers read it), so on a
    // first visit this hides it before first paint until React mounts the
    // opening animation. Skipped when the intro already played this session or
    // the visitor prefers reduced motion. HomePage.jsx removes the class.
    (function () {
      try {
        if (location.pathname !== '/') return;
        if (sessionStorage.getItem('openingAnimationShown')) return;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.documentElement.classList.add('intro-pending');
      } catch (e) { /* storage blocked: show the page */ }
    })();
  </script>
